<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting | Jones Anderson</title>
<script>
  // Old project links (vortex1.dev/sao-many-saos) go to the new project page.
  var slug = location.pathname.replace(/^\/|\/$/g, '');
  // Missing pages on Emma & Alisa's site (and typos of its name) go to their home page.
  if (/^emma(-?and)?-?alisa(\/|$)/i.test(slug)) location.replace('/emma-and-alisa/');
  else fetch('/data/projects.json').then(function (r) { return r.json(); }).then(function (d) {
    var known = d.projects.some(function (p) { return p.slug === slug; }) || (d.oldSlugs || {})[slug];
    location.replace(known ? '/project.html?p=' + encodeURIComponent(slug) : '/');
  }).catch(function () { location.replace('/'); });
</script>
</head>
<body><p>Redirecting to <a href="/">vortex1.dev</a>.</p></body>
</html>
